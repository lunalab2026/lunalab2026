name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: lunalab2026
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#003b00&color_dots=#e6f4ea,#9be9a8,#40c463,#00a82d,#006d1f
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00ff41&color_dots=#0d1f0d,#003b00,#008f11,#00ff41,#b6ffb6&color_dot_border=#020a03
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
