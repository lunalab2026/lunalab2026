name: Update Matrix telemetry

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/update_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar assets/telemetry.svg
        env:
          GH_LOGIN: lunalab2026
          # Opcional: crie o secret STATS_TOKEN (PAT com read:user) para incluir contribuições privadas.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/update_stats.py

      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry.svg
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "chore: atualizar telemetria Matrix"
            git push
          fi
